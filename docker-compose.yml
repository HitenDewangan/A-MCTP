services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/amctp.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080,http://localhost:3000,http://localhost
    volumes:
      - ./backend/app:/app/app
      - uploads:/tmp/amctp_uploads
      - dbdata:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/amctp.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
    volumes:
      - ./backend/app:/app/app
      - uploads:/tmp/amctp_uploads
      - dbdata:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  uploads:
  dbdata:
